<!DOCTYPE html>
<html lang="sv">

<head>
    <link rel="stylesheet" href="style/style.css">
    <meta charset="UTF-8">
</head>
<body>
<div id="contentGrid">
    <div id="buttonDiv">
        <nav>
            <button id="simpleViewButton" class="outerNavButton">ÖVERSIKT</button>
            <button id="advancedViewButton" class="outerNavButton">HJÄLP</button>
            <button id="historyViewButton" class="outerNavButton currentPage">HISTORIK</button>
            <button id="arbetsmiljoViewButton" class="outerNavButton">ARBETSMILJÖ</button>
            <button id="settingsViewButton" class="outerNavButton">INSTÄLLNINGAR</button>
        </nav>
    </div>

    <div id="contentDiv">
         <div id="graphGrid">
            <div id = "timeRangeButtons">                
                <div class="dropdown">
                    <button class="dropButton">DAGAR<img src="./img/dropdown.png"></img></button>
                    <div id="dayDropdown" class="dropdownContent"></div>       
                </div>
                <div class="dropdown">
                    <button class="dropButton">VECKOR<img src="./img/dropdown.png"></button>
                    <div id="weekDropdown" class="dropdownContent"></div>       
                </div>
                <div class="dropdown">
                    <button class="dropButton">MÅNADER<img src="./img/dropdown.png"></button>
                    <div id="monthDropdown" class="dropdownContent"></div>       
                </div>                
            </div>
            <div id="labelDiv"><label id="graphLabel">Välj ett datum.</label></div>
            <div id = "metricButtons">
                <button id="graphWifiButton" class="graphButton">WIFI-STYRKA</button>
                <button id="graphUpspeedButton" class="graphButton">UPPLADDNING</button>
                <button id="graphDownspeedButton" class="graphButton">NEDLADDNING</button>
                <button id="graphPingButton" class="graphButton">PING</button>               
                <button id="graphInterruptButton" class="graphButton">STÖRNINGAR</button>
                <button id="graphWorkButton" class="graphButton">ARBETSTID</button>               
            </div>                               
            <canvas id="historyGraph"></canvas>
            <div id="metricInfoDiv">
                <p id="metricInfo">Välj mätvärde till vänster.<br>
                Du kan även välja tidspann här ovan!</p>
            </div>
        </div>
    </div>
</div>



<script src="../node_modules/chart.js/dist/chart.umd.min.js"></script>
<script src="../node_modules/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src ="script/graph.js"></script>
<script src="script/loadHistoryView.js"></script>
</body>
</html>
