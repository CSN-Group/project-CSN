<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <div id=simpleGrid>

    <div id="buttonDiv">
      <nav>
        <button id="simpleViewButton" class="outerNavButton currentPage">ÖVERSIKT</button>
        <button id="advancedViewButton" class="outerNavButton">HJÄLP</button>
        <button id="historyViewButton" class="outerNavButton">HISTORIK</button>
        <button id="arbetsmiljoViewButton" class="outerNavButton">ARBETSMILJÖ</button>
        <button id="settingsViewButton" class="outerNavButton">INSTÄLLNINGAR</button>
      </nav>
    </div>

    <div id="connectionInfoDiv">
     <h2 class="overviewHeader">NÄTVERKSANSLUTNING</h2>
      <div id="connectionInfo">
        <div id="wifiIconDiv" class="wifi">
          <svg viewBox="0 0 24 24" width="64" height="64">
            <path class="bar1" d="M12 20a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z" />
            <path class="bar2" d="M9.4 16.6a1 1 0 0 1-1.4-1.4 6 6 0 0 1 8.5 0 1 1 0 1 1-1.4 1.4 4 4 0 0 0-5.7 0z" />
            <path class="bar3" d="M6.3 13.5a1 1 0 0 1-1.4-1.4 10 10 0 0 1 14.2 0 1 1 0 1 1-1.4 1.4 8 8 0 0 0-11.4 0z" />
            <path class="bar4" d="M3.1 10.3a1 1 0 0 1-1.4-1.4 14 14 0 0 1 20.6 0 1 1 0 1 1-1.4 1.4 12 12 0 0 0-17.8 0z" />
          </svg>
          <span class="tooltip" id='wifiTooltip'>Wifi information</span>
        </div>
        <span id="wifiText">LADDAR</span>

        <img src="img/ethernet.png" alt="Ethernet" id="ethernetIcon">
        <span id="ethernetText">LADDAR</span>
      </div>
    </div>

    <div id="softActionsDiv">
      <h2 class="overviewHeader">ARBETSMILJÖ-NOTISER</h2>
      <ul id="softActionsList">        
      </ul>
    </div> 
  
    <div id="techDiv">
      <div id="speedtestDiv">
        <div id="speedtestHeaderRow">
          <h2 id="speedtestHeader">MÄTNINGAR</h2>
          <label id="speedtestToggle">
            I MÖTE
            <img id="meetingLamp" src="./img/redBox.png" alt="Lamp">
          </label>
        </div>

        <h2 id="lastUpdatedHeader">SENAST UPPDATERAD</h2>
        <span id="lastUpdatedText">INGEN MÄTNING</span>

        <div id="speedtestDetails">
          <div class="gaugeWrapper" id="downGaugeWrapper">
            <label for="downloadValue" class="gaugeLabel">NEDLADDNING</label>
            <span class="speedValue" id="downloadValue">--</span>
            <canvas id="downSpeedometer" class="speedometer"></canvas>
            <span class="tooltip" id='downTooltip'>Downspeed tooltip</span>
          </div>

          <div class="gaugeWrapper" id="upGaugeWrapper">
            <label for="uploadValue" class="gaugeLabel">UPPLADDNING</label>
            <span class="speedValue" id="uploadValue">--</span>
            <canvas id="upSpeedometer" class="speedometer"></canvas>
            <span class="tooltip" id='upTooltip'>Upspeed tooltip</span>
          </div>

      </div>
        <div id="pingRow">
          <img id="pingIcon" src="./img/ping.png" alt="Ping Icon">
          <label id="pingLabel">PING</label>
          <span id="pingValue">-</span>
          <label id="pingUnit"> ms</label>
          <div id="ping-bar" class="ping-bar">
            <div id="ping-level" class="ping-level"></div>
          </div>
          <span class="tooltip" id='pingTooltip'>Ping tooltip</span>
        </div>

      <button id="runSpeedtestButton">MÄT NU</button>
        <span id="speedtestButtonDisclaimer">En mätning kan ta upp till 25 sekunder. Tålamod!</span>
    </div>

      <div id="techActionsDiv">
        <h2 class="overviewHeader">ANMÄRKNINGAR</h2>
        <ul id="techActionsList">
       </ul>
      </div>

    </div>
    
    <footer></footer>
  </div>


  <script src="../node_modules/gaugeJS/dist/gauge.min.js"></script>
  <script src="script/gauge.js"></script>
  <script src="script/basicNetworkInfo.js"></script>
  <script src="script/actions.js"></script>
  <script src="script/loadSimpleView.js"></script>
</body>
</html>
