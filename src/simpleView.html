<!DOCTYPE html>
<html>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

<head>
  <link rel="stylesheet" href="style/style.css">
  <title>My Electron App</title>
</head>
<body>
  <div id=grid>

    <div id="buttonDiv">
      <nav>
        <button id="simpleViewButton">BASIC</button>
        <button id="advancedViewButton">ADVANCED</button>
      </nav>
    </div>
    
    <div id="compInfo">

    </div>

    <div id="networkInfo">
      <div id="basicNetworkInfo"></div>
      <button id="runSpeedTestButton">Speedtest</button>
      <div id="speedTestInfo"></div>
    </div>

    <div id="restartInfo">
      <!-- Enter info here -->
    </div>

    <div id="gaugeDiv">
      <canvas id="speedometer" width="200" height="100"></canvas>
      <div id="wifi-icon" class="wifi">
        <svg viewBox="0 0 24 24" width="64" height="64">
          <path class="bar1" d="M12 20a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z" />
          <path class="bar2" d="M9.4 16.6a1 1 0 0 1-1.4-1.4 6 6 0 0 1 8.5 0 1 1 0 1 1-1.4 1.4 4 4 0 0 0-5.7 0z" />
          <path class="bar3" d="M6.3 13.5a1 1 0 0 1-1.4-1.4 10 10 0 0 1 14.2 0 1 1 0 1 1-1.4 1.4 8 8 0 0 0-11.4 0z" />
          <path class="bar4" d="M3.1 10.3a1 1 0 0 1-1.4-1.4 14 14 0 0 1 20.6 0 1 1 0 1 1-1.4 1.4 12 12 0 0 0-17.8 0z" />
        </svg>
      </div>
    </div>

    <div id="actionDiv">
      <h1><u>Åtgärder</u></h1>
      <ul id="actionList"></ul>
    </div>

    <div id="graphDiv">
      <button id="graphPingButton">Ping</button>
      <button id="graphUpspeedButton">Upspeed</button>
      <button id="graphDownspeedButton">Downspeed</button>
      <button id="graphWifiButton">Wifi</button>
      <button id="weekButton">Week</button>
      <canvas id="historyGraph" style="width:100%;max-width:500px"></canvas>
    </div>

  </div>      

 
  <script src="script/graph.js"></script>  
  <script src="script/basicNetworkInfo.js"></script>
  <script src="script/compRestart.js"></script>
  <script src="script/pcNameInfo.js"></script>  
  <script src="script/actions.js"></script>

  <script src="../node_modules/gaugeJS/dist/gauge.min.js"></script>
  <script src="script/gauge.js"></script>

  <script src="script/loadSimpleView.js"></script>
</body>
</html>
